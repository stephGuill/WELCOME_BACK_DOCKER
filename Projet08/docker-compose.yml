services:
  database:
    image: mysql:8.0
    container_name: projet08-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projetdb
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - appnet

  backend:
    build:
      context: ./backend
    container_name: projet08-backend
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: projetdb
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - database
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    container_name: projet08-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - appnet

  adminer:
    image: adminer:latest
    container_name: projet08-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - database
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
    driver: bridge
