server {
  listen 80;          # Nginx écoute sur le port 80
  server_name _;      # Accepte toutes les requêtes (pas de vhost spécifique)

  # Dossier racine des fichiers statiques du frontend
  root /usr/share/nginx/html;
  index index.html;   # Fichier servi par défaut

  # Route pour les fichiers statiques : tente de trouver le fichier, sinon retourne index.html
  # (support des SPA Single Page Application)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse proxy : toutes les requêtes commençant par /api/ sont transmises au backend Node.js
  # Le backend est accessible par son nom de service Docker 'backend' sur le port 3000
  location /api/ {
    proxy_pass http://backend:3000/api/;           # transfert vers le service backend
    proxy_http_version 1.1;                        # utilise HTTP/1.1 (support keep-alive)
    proxy_set_header Host $host;                   # transmet le Host original
    proxy_set_header X-Real-IP $remote_addr;       # IP réelle du client
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # chaîne des proxys
    proxy_set_header X-Forwarded-Proto $scheme;    # protocole original (http/https)
  }
}
