server {
    # Nginx écoute sur le port 80 et est le serveur par défaut
    listen 80 default_server;
    # Accepte toutes les requêtes quelle que soit l'en-tête Host
    server_name _;

    # Répertoire racine où sont servis les fichiers statiques
    root /usr/share/nginx/html;
    # Fichiers index prioritaires : d'abord index.html, puis index.php si absent
    index index.html index.php;

    # Pour toute URL, Nginx cherche le fichier correspondant ou renvoie 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Traitement des fichiers .php via PHP-FPM (FastCGI)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;  # Configuration standard FastCGI de Debian
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;  # Socket Unix du démon PHP-FPM 8.2
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;  # Chemin absolu du script
    }

    # Interdit l'accès aux fichiers .htaccess (sécurité)
    location ~ /\.ht {
        deny all;
    }
}
}
