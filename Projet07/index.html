<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tic Tac Toe Docker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: #e5e7eb;
            margin: 0;
            padding: 20px;
        }
        
        .wrap {
            max-width: 780px;
            margin: auto;
        }
        
        h1 {
            margin: 0 0 10px;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            gap: 8px;
            margin: 20px 0;
        }
        
        .cell {
            width: 90px;
            height: 90px;
            font-size: 36px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #f9fafb;
            cursor: pointer;
        }
        
        .cell:hover {
            background: #374151;
        }
        
        button {
            padding: 10px 14px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }
        
        #status {
            margin: 10px 0;
            font-weight: bold;
        }
        
        pre {
            background: #0b1220;
            padding: 12px;
            border-radius: 8px;
            overflow: auto;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>Projet07 - Tic Tac Toe</h1>
        <p>Résultats persistants via Docker Volume <strong>game-results</strong>.</p>

        <div id="status">Tour du joueur X</div>
        <div class="board" id="board"></div>
        <button id="resetBtn">Nouvelle partie</button>
        <button id="loadBtn">Charger results.json</button>

        <h3>Contenu de results.json</h3>
        <pre id="results">[]</pre>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');
        const cells = Array(9).fill('');
        let current = 'X';
        let gameOver = false;

        const wins = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function render() {
            boardEl.innerHTML = '';
            cells.forEach((v, i) => {
                const b = document.createElement('button');
                b.className = 'cell';
                b.textContent = v;
                b.onclick = () => play(i);
                boardEl.appendChild(b);
            });
        }

        function checkWinner() {
            for (const [a, b, c] of wins) {
                if (cells[a] && cells[a] === cells[b] && cells[b] === cells[c]) return cells[a];
            }
            if (cells.every(Boolean)) return 'draw';
            return null;
        }

        async function saveResult(winner) {
            const payload = {
                winner,
                playedAt: new Date().toISOString(),
                board: [...cells]
            };
            await fetch('/save.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            await loadResults();
        }

        async function loadResults() {
            const r = await fetch('/results.json?_=' + Date.now());
            const data = await r.json();
            resultsEl.textContent = JSON.stringify(data, null, 2);
        }

        async function play(i) {
            if (gameOver || cells[i]) return;
            cells[i] = current;
            render();
            const winner = checkWinner();
            if (winner) {
                gameOver = true;
                statusEl.textContent = winner === 'draw' ? 'Match nul' : `Gagnant : ${winner}`;
                await saveResult(winner);
                return;
            }
            current = current === 'X' ? 'O' : 'X';
            statusEl.textContent = `Tour du joueur ${current}`;
        }

        function resetGame() {
            cells.fill('');
            current = 'X';
            gameOver = false;
            statusEl.textContent = 'Tour du joueur X';
            render();
        }

        document.getElementById('resetBtn').onclick = resetGame;
        document.getElementById('loadBtn').onclick = loadResults;

        render();
        loadResults();
    </script>
</body>

</html>
