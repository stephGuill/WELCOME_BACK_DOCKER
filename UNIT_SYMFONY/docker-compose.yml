services:
  symfony_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Symfony_app
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    depends_on:
      - symfony_db
    networks:
      symfony_network:
        aliases:
          - Symfony_app

  symfony_nginx:
    image: nginx:alpine
    container_name: Symfony_nginx
    ports:
      - "8090:80"
    volumes:
      - ./app:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - symfony_app
    networks:
      symfony_network:
        aliases:
          - Symfony_nginx

  symfony_db:
    image: mysql:8.0
    container_name: Symfony_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: Symfony
      MYSQL_USER: Symfony
      MYSQL_PASSWORD: Symfony
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - symfony_db_data:/var/lib/mysql
    networks:
      symfony_network:
        aliases:
          - Symfony_db

  symfony_phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: Symfony_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: Symfony_db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8091:80"
    depends_on:
      - symfony_db
    networks:
      symfony_network:
        aliases:
          - Symfony_phpmyadmin

  symfony_adminer:
    image: adminer:latest
    container_name: Symfony_adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - symfony_db
    networks:
      symfony_network:
        aliases:
          - Symfony_adminer

volumes:
  symfony_db_data:

networks:
  symfony_network:
    driver: bridge
