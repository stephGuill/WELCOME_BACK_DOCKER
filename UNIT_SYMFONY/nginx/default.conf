server {
    listen 80;                    # Nginx écoute sur le port 80
    server_name localhost;        # Nom de domaine (localhost en développement)
    root /var/www/html/public;    # Dossier public de Symfony (contient index.php)
    index index.php index.html;   # Fichiers index recherchés

    # Toutes les URLs sont redirigées vers index.php (Front Controller Symfony)
    # $is_args$args : transmet les paramètres GET (?foo=bar) à Symfony
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Traitement des requêtes vers index.php via PHP-FPM (FastCGI)
    # Ce bloc est marqué "internal" : ne peut être appelé que par Nginx lui-même (pas directement par le client)
    location ~ ^/index\.php(/|$) {
        fastcgi_pass Symfony_app:9000;              # service PHP-FPM (port 9000 par défaut)
        fastcgi_split_path_info ^(.+\.php)(/.*)$;   # sépare le chemin du script du path_info
        include fastcgi_params;                     # paramètres FastCGI standard
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;  # chemin absolu du script PHP
        fastcgi_param DOCUMENT_ROOT $realpath_root; # racine du document (pour Symfony)
        internal;                                   # sécurité : accès réservé à Nginx
    }

    # Bloque l'accès direct à tout autre fichier .php (sécurité : seul index.php doit être exécuté)
    location ~ \.php$ {
        return 404;
    }

    # Fichiers de logs Nginx pour le débogage
    error_log /var/log/nginx/project_error.log;
    access_log /var/log/nginx/project_access.log;
}
